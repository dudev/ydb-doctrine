name: Test

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHPStan
            run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          - name: PHPCS
            run: vendor/bin/phpcs
          # The server is the other half of what is under test, so run it on every release line
          # that has the ALTER TABLE features (24.x lacks DROP NOT NULL and the flags for the rest).
          - name: PHPUnit (YDB 25.4)
            run: vendor/bin/phpunit
            ydb-version: '25.4'
          # The build the managed service runs (`SELECT version()` says stable-26-3-1-17 there).
          - name: PHPUnit (YDB 26.3.1.17)
            run: vendor/bin/phpunit
            ydb-version: '26.3.1.17'
          - name: PHPUnit (YDB latest)
            run: vendor/bin/phpunit
            ydb-version: latest
          - name: PHPUnit (YDB trunk)
            run: vendor/bin/phpunit
            ydb-version: trunk
    env:
      # Which ydbplatform/local-ydb tag docker-compose.yml starts; empty falls back to `latest`.
      YDB_VERSION: ${{ matrix.ydb-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same image (PHP 8.2 + grpc, built from docker/php/Dockerfile) each
      # matrix job builds independently - self-contained, no registry to push
      # to or pull from. GHA's cache backend makes this fast once warm: only
      # the very first run after a Dockerfile change pays the full grpc
      # compile in all three jobs at once, every run after that hits cache.
      - name: Build PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          tags: ydb-doctrine-php:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: .composer-cache
          key: composer-${{ hashFiles('composer.json') }}

      # No lock file (this is a library): resolve fresh within composer.json's constraints, like a
      # consumer would. The token keeps the fork's VCS repository from burning the anonymous
      # GitHub API limit (a cold resolve is ~40 requests, three jobs run it).
      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: docker compose run --rm -e COMPOSER_CACHE_DIR=/app/.composer-cache -e COMPOSER_AUTH php composer update -o --no-progress

      - name: ${{ matrix.name }}
        run: docker compose run --rm php ${{ matrix.run }}
