name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: PHPStan / PHPCS / PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds and runs against the same docker-compose.yml (PHP 8.2 + grpc, YDB
      # with enable_views on) used for local development, so CI can't drift from
      # what was actually verified by hand - a plain PHP-setup-action + a bare
      # YDB services: container (the old setup) can't enable feature flags on the
      # YDB image and had drifted to PHP 8.1, which doctrine/dbal ^4.4 no longer
      # supports.
      - name: Build PHP image
        run: docker compose build php

      - name: Install Composer dependencies
        run: docker compose run --rm php composer install -o --no-progress

      - name: PHPStan
        run: docker compose run --rm php vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: PHPCS
        run: docker compose run --rm php vendor/bin/phpcs

      - name: PHPUnit
        run: docker compose run --rm php vendor/bin/phpunit
