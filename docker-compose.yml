services:
  db:
    # Same image the other YDB SDKs test against; its numbered tags track real releases
    # (the cr.yandex/yc/yandex-docker-local-ydb `latest` is a stale 24.3 build).
    # YDB_VERSION picks the tag (25.4, latest, trunk, ...), CI runs a matrix over it.
    image: ydbplatform/local-ydb:${YDB_VERSION:-latest}
    ports:
      - ${YDB_MON_PORT:-8765}:8765
      - ${YDB_GRPC_PORT:-2136}:2136
    # Flags that are off by default on the 25.x servers and that the tests need: views, ADD COLUMN
    # ... NOT NULL DEFAULT (sic: the flag really is spelled "colums") and unique indexes on an existing
    # table. `local_ydb deploy` takes them. The entrypoint is spelled out because 24.x images have none.
    entrypoint: ["bash", "/initialize_local_ydb"]
    command: ["--enable-feature-flag", "enable_views", "--enable-feature-flag", "enable_add_colums_with_defaults", "--enable-feature-flag", "enable_add_unique_index"]

  php:
    # Explicit tag so CI can build it with buildx (GHA cache) and reuse it here without a rebuild.
    image: ydb-doctrine-php:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    # phpunit.xml forces YDB_URL to localhost:2136 (it expects to run on the host,
    # next to a port-mapped `db` container, per the GitHub Actions job). Sharing
    # db's network namespace makes that same URL resolve correctly in Docker too.
    network_mode: service:db
    depends_on:
      - db
